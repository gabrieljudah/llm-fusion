# LLM Fusion — council roster.
#
# TWO rosters, because the two modes want different kinds of diversity:
#   advise_agents  -> diversity of PERSPECTIVE  (different lenses, mixed models)
#   execute_agents -> diversity of MODEL only   (one shared builder role; the
#                     point is to see how each model executes the SAME task,
#                     then the judge fuses the best of each)
#
# Subset YAML only (maps + lists of inline {flow} mappings).
#
# v1.5 roster (2026-09-05): one frontier model per vendor —
#   Claude Fable 5.1 (claude-fable-5-1) · Codex GPT-6 Astra (gpt-6-astra) · Grok 4.6

defaults:
  round1_timeout_sec: 300
  judge_timeout_sec: 360
  executor_timeout_sec: 900
  retries: 1
  quorum: 2

# handoff = the main Claude Code session is the Judge (default).
# auto    = runner spawns a fresh judge CLI (headless / unattended runs).
judge:
  backend: handoff
  cli: claude
  model: claude-fable-5-1

# execute mode: the autonomous executor is codex-only (the only CLI with a real
# OS seatbelt). Auditor is a different vendor on purpose (Grok reads the
# deliverable that is handed to it inside the prompt; it never executes).
executor:
  cli: codex
  model: gpt-6-astra
auditor:
  cli: grok
  model: grok-4.6

# ---- ADVISE: 7 lenses across the 3 current models -----------------------------
# Each seat wears a DIFFERENT lens. Any lens can ride any model — this pairing
# is editable; the only hard rule is >=3 distinct models. Providers: claude,
# codex, grok (3 vendors, one frontier model each).
advise_agents:
  - { name: claude-architect,       cli: claude, model: claude-fable-5-1, role: roles/architect.md }
  - { name: codex-pragmatist,       cli: codex,  model: gpt-6-astra,      role: roles/pragmatist.md }
  - { name: grok-skeptic,           cli: grok,   model: grok-4.6,         role: roles/skeptic.md }
  - { name: claude-firstprinciples, cli: claude, model: claude-fable-5-1, role: roles/first-principles.md }
  - { name: codex-operator,         cli: codex,  model: gpt-6-astra,      role: roles/operator.md }
  - { name: claude-useradvocate,    cli: claude, model: claude-fable-5-1, role: roles/user-advocate.md }
  - { name: grok-realist,           cli: grok,   model: grok-4.6,         role: roles/realist.md }

# ---- EXECUTE: the build-off (SAME role, one per distinct model) --------------
# Identical builder role; the diversity IS the model. Judge fuses the best of
# each into one spec, then the executor builds it. Keep models distinct here
# (same role + same model = redundant). grok PLANS here like the others — it
# never executes; the autonomous executor stays codex-only (see executor:).
execute_agents:
  - { name: fable-builder,  cli: claude, model: claude-fable-5-1, role: roles/builder.md }
  - { name: codex-builder,  cli: codex,  model: gpt-6-astra,      role: roles/builder.md }
  - { name: grok-builder,   cli: grok,   model: grok-4.6,         role: roles/builder.md }
